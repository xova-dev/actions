name: Deploy checked documentation
on:
  workflow_call:
    inputs:
      provider:
        type: string
        required: true
      expected-sha:
        type: string
        required: true
      release-tag:
        type: string
        default: ""
      deployment-policy:
        type: string
        default: latest-stable
      artifact-name:
        type: string
        default: documentation
      environment-name:
        type: string
        default: ""
      concurrency-group:
        type: string
        default: ""
      site-id:
        type: string
        default: documentation
      site-directory:
        type: string
        default: ""
      working-directory:
        type: string
        default: .
      toolchain:
        type: string
        default: node
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: npm ci
      deploy-command:
        type: string
        default: npm exec --no -- wrangler deploy
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate deployment selection
        env:
          PROVIDER: ${{ inputs.provider }}
          POLICY: ${{ inputs.deployment-policy }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          case "$PROVIDER" in pages|cloudflare) ;; *) exit 1 ;; esac
          case "$POLICY" in always) ;; latest-stable) test -n "$RELEASE_TAG" ;; *) exit 1 ;; esac
          if [ "$PROVIDER" = cloudflare ]; then
            case "$TOOLCHAIN" in node|mise) ;; *) exit 1 ;; esac
          fi
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment-name || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page-url }}
    concurrency:
      group: ${{ inputs.concurrency-group || format('pages-{0}', github.repository) }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: policy
        if: inputs.deployment-policy == 'latest-stable'
        uses: $/actions/latest-release
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
      - id: deployment
        uses: $/actions/docs-pages
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
        if: inputs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
    needs: validate
    if: inputs.provider == 'pages'
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment-name || 'docs-production' }}
    concurrency:
      group: ${{ inputs.concurrency-group || format('cloudflare-{0}-{1}', github.repository, inputs.site-id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.toolchain == 'node' && inputs.node-version || '24' }}
      - id: policy
        if: inputs.deployment-policy == 'latest-stable'
        uses: $/actions/latest-release
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false
        if: inputs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
      - uses: jdx/mise-action@v4.3.0
        if: ${{ (inputs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true') && inputs.toolchain == 'mise' }}
        with:
          cache: true
      - name: Install deployment dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -e -o pipefail -c "$COMMAND"
        if: inputs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
      - uses: $/actions/docs-cloudflare
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
          site-directory: ${{ inputs.site-directory }}
          working-directory: ${{ inputs.working-directory }}
          deploy-command: ${{ inputs.deploy-command }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: inputs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
    needs: validate
    if: inputs.provider == 'cloudflare'
    permissions:
      contents: read
