name: Deploy checked documentation
on:
  workflow_call:
    inputs:
      config-file:
        description: Tracked project JSON configuration at the selected source.
        type: string
        default: .github/xova.json
      expected-sha:
        type: string
        required: true
      release-tag:
        type: string
        default: ""
      artifact-name:
        type: string
        default: documentation
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.config.outputs.config }}
      provider: ${{ fromJSON(steps.config.outputs.config).docs.provider }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: config
        uses: $/actions/project-config
        with:
          config-file: ${{ inputs.config-file }}
          expected-sha: ${{ inputs.expected-sha }}
          task: deploy
      - name: Require a release for stable deployment policy
        env:
          POLICY: ${{ fromJSON(steps.config.outputs.config).docs.deployment-policy }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: '[ "$POLICY" != latest-stable ] || test -n "$RELEASE_TAG"'
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ fromJSON(needs.validate.outputs.config).docs.environment-name || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page-url }}
    concurrency:
      group: ${{ fromJSON(needs.validate.outputs.config).docs.concurrency-group || format('pages-{0}', github.repository) }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: policy
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'latest-stable'
        uses: $/actions/latest-release
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
      - id: deployment
        uses: $/actions/docs-pages
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
    needs: validate
    if: needs.validate.outputs.provider == 'pages'
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ fromJSON(needs.validate.outputs.config).docs.environment-name || 'docs-production' }}
    concurrency:
      group: ${{ fromJSON(needs.validate.outputs.config).docs.concurrency-group || format('cloudflare-{0}-{1}', github.repository, fromJSON(needs.validate.outputs.config).docs.site-id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(needs.validate.outputs.config).setup.toolchain == 'node' && fromJSON(needs.validate.outputs.config).setup.node-version || '24' }}
      - id: policy
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'latest-stable'
        uses: $/actions/latest-release
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
      - uses: $/actions/setup
        with:
          toolchain: ${{ fromJSON(needs.validate.outputs.config).setup.toolchain }}
          node-version: ${{ fromJSON(needs.validate.outputs.config).setup.node-version }}
          install-command: ${{ fromJSON(needs.validate.outputs.config).docs.install-command }}
          working-directory: ${{ fromJSON(needs.validate.outputs.config).docs.working-directory }}
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
      - uses: $/actions/docs-cloudflare
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
          site-directory: ${{ fromJSON(needs.validate.outputs.config).docs.site-directory }}
          working-directory: ${{ fromJSON(needs.validate.outputs.config).docs.working-directory }}
          deploy-command: ${{ fromJSON(needs.validate.outputs.config).docs.deploy-command }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: fromJSON(needs.validate.outputs.config).docs.deployment-policy == 'always' || steps.policy.outputs.eligible == 'true'
    needs: validate
    if: needs.validate.outputs.provider == 'cloudflare'
    permissions:
      contents: read
