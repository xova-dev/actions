name: Check and build documentation
on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
      check-command:
        type: string
        required: true
      build-command:
        type: string
        default: npm run docs:build
      site-directory:
        type: string
        required: true
      working-directory:
        type: string
        default: '.'
      toolchain:
        description: node or mise; other toolchains use the composite action directly.
        type: string
        default: node
      node-version:
        type: string
        default: '24'
      install-command:
        type: string
        default: npm ci
      artifact-name:
        type: string
        default: documentation
      retention-days:
        type: number
        default: 7
    outputs:
      source-sha:
        description: Exact documentation source commit.
        value: ${{ jobs.build.outputs.source-sha }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source-sha: ${{ steps.build.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - id: source
        run: |
          source_sha=$(git rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Validate toolchain selection
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: 'case "$TOOLCHAIN" in node|mise) ;; *) exit 1 ;; esac'
      - uses: actions/setup-node@v7
        if: inputs.toolchain == 'node'
        with:
          node-version: ${{ inputs.node-version }}
      - uses: jdx/mise-action@v4.3.0
        if: inputs.toolchain == 'mise'
        with:
          cache: true
      - name: Install locked dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - id: build
        uses: $/actions/docs-build
        with:
          expected-sha: ${{ steps.source.outputs.sha }}
          check-command: ${{ inputs.check-command }}
          build-command: ${{ inputs.build-command }}
          site-directory: ${{ inputs.site-directory }}
          working-directory: ${{ inputs.working-directory }}
          artifact-name: ${{ inputs.artifact-name }}
          retention-days: ${{ inputs.retention-days }}
