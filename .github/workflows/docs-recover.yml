name: Rebuild and recover published documentation
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
      published-sha:
        type: string
        required: true
      toolchain:
        type: string
        default: node
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: npm ci
      docs-provider:
        type: string
        default: pages
      docs-check-command:
        type: string
        default: ""
      docs-build-command:
        type: string
        default: npm run docs:build
      docs-site-directory:
        type: string
        default: ""
      docs-working-directory:
        type: string
        default: .
      docs-install-command:
        type: string
        default: ""
      docs-environment-name:
        type: string
        default: ""
      docs-concurrency-group:
        type: string
        default: ""
      docs-site-id:
        type: string
        default: documentation
      docs-deploy-command:
        type: string
        default: npm exec --no -- wrangler deploy
      deployment-policy:
        type: string
        default: latest-stable
      artifact-name:
        type: string
        default: documentation
      retention-days:
        type: number
        default: 7
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      source-sha:
        value: ${{ jobs.source.outputs.source-sha }}
        description: Confirmed published source used to rebuild documentation.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: source
        uses: $/actions/release-source
        with:
          mode: recovery
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.published-sha }}
          docs-provider: ${{ inputs.docs-provider }}
          deployment-policy: ${{ inputs.deployment-policy }}
  documentation:
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      source-ref: ${{ needs.source.outputs.source-sha }}
      check-command: ${{ inputs.docs-check-command }}
      build-command: ${{ inputs.docs-build-command }}
      site-directory: ${{ inputs.docs-site-directory }}
      working-directory: ${{ inputs.docs-working-directory }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.docs-install-command || inputs.install-command }}
    needs: source
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      provider: ${{ inputs.docs-provider }}
      expected-sha: ${{ needs.source.outputs.source-sha }}
      release-tag: ${{ inputs.release-tag }}
      deployment-policy: ${{ inputs.deployment-policy }}
      artifact-name: ${{ inputs.artifact-name }}
      environment-name: ${{ inputs.docs-environment-name }}
      concurrency-group: ${{ inputs.docs-concurrency-group }}
      site-id: ${{ inputs.docs-site-id }}
      site-directory: ${{ inputs.docs-site-directory }}
      working-directory: ${{ inputs.docs-working-directory }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.docs-install-command || inputs.install-command }}
      deploy-command: ${{ inputs.docs-deploy-command }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    needs:
      - source
      - documentation
