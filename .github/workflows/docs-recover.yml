name: Rebuild and recover published documentation
on:
  workflow_call:
    inputs:
      config-file:
        description: Tracked project JSON configuration at the selected source.
        type: string
        default: .github/xova.json
      release-tag:
        type: string
        required: true
      published-sha:
        type: string
        required: true
      artifact-name:
        type: string
        default: documentation
      retention-days:
        type: number
        default: 7
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      source-sha:
        value: ${{ jobs.source.outputs.source-sha }}
        description: Confirmed published source used to rebuild documentation.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.published-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: config
        uses: $/actions/project-config
        with:
          config-file: ${{ inputs.config-file }}
          expected-sha: ${{ inputs.published-sha }}
          task: recovery
      - id: source
        uses: $/actions/release-source
        with:
          mode: recovery
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.published-sha }}
          docs-provider: ${{ fromJSON(steps.config.outputs.config).docs.provider }}
          deployment-policy: ${{ fromJSON(steps.config.outputs.config).docs.deployment-policy }}
  documentation:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
    with:
      kind: docs
      config-file: ${{ inputs.config-file }}
      source-sha: ${{ needs.source.outputs.source-sha }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
    needs: source
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      config-file: ${{ inputs.config-file }}
      expected-sha: ${{ needs.source.outputs.source-sha }}
      release-tag: ${{ inputs.release-tag }}
      artifact-name: ${{ inputs.artifact-name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    needs:
      - source
      - documentation
