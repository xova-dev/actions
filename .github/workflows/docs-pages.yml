name: Deploy documentation to GitHub Pages
on:
  workflow_call:
    inputs:
      expected-sha:
        description: Exact source selected by the caller's deployment policy.
        type: string
        required: true
      artifact-name:
        type: string
        default: documentation
      environment-name:
        type: string
        default: github-pages
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deployment.outputs.page-url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: deployment
        uses: $/actions/docs-pages
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
