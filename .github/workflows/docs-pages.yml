name: Deploy documentation to GitHub Pages
on:
  workflow_call:
    inputs:
      expected-sha:
        description: Exact source selected by the caller's deployment policy.
        type: string
        required: true
      artifact-name:
        type: string
        default: documentation
      environment-name:
        type: string
        default: github-pages
      release-tag:
        type: string
        default: ""
      deployment-policy:
        type: string
        default: always
      concurrency-group:
        type: string
        default: ""
jobs:
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      provider: pages
      expected-sha: ${{ inputs.expected-sha }}
      artifact-name: ${{ inputs.artifact-name }}
      environment-name: ${{ inputs.environment-name }}
      release-tag: ${{ inputs.release-tag }}
      deployment-policy: ${{ inputs.deployment-policy }}
      concurrency-group: ${{ inputs.concurrency-group }}
