name: Deploy documentation to Cloudflare
on:
  workflow_call:
    inputs:
      expected-sha:
        type: string
        required: true
      artifact-name:
        type: string
        default: documentation
      site-id:
        description: Stable deployment target identity for concurrency across runs.
        type: string
        default: documentation
      environment-name:
        type: string
        default: docs-production
      site-directory:
        type: string
        required: true
      working-directory:
        type: string
        default: .
      toolchain:
        type: string
        default: node
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: npm ci
      deploy-command:
        type: string
        default: npm exec --no -- wrangler deploy
      release-tag:
        type: string
        default: ""
      deployment-policy:
        type: string
        default: always
      concurrency-group:
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      provider: cloudflare
      expected-sha: ${{ inputs.expected-sha }}
      artifact-name: ${{ inputs.artifact-name }}
      site-id: ${{ inputs.site-id }}
      environment-name: ${{ inputs.environment-name }}
      site-directory: ${{ inputs.site-directory }}
      working-directory: ${{ inputs.working-directory }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      deploy-command: ${{ inputs.deploy-command }}
      release-tag: ${{ inputs.release-tag }}
      deployment-policy: ${{ inputs.deployment-policy }}
      concurrency-group: ${{ inputs.concurrency-group }}
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
