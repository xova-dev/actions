name: Deploy documentation to Cloudflare
on:
  workflow_call:
    inputs:
      expected-sha:
        type: string
        required: true
      artifact-name:
        type: string
        default: documentation
      site-id:
        description: Stable deployment target identity for concurrency across runs.
        type: string
        default: documentation
      environment-name:
        type: string
        default: docs-production
      site-directory:
        type: string
        required: true
      working-directory:
        type: string
        default: '.'
      toolchain:
        type: string
        default: node
      node-version:
        type: string
        default: '24'
      install-command:
        type: string
        default: npm ci
      deploy-command:
        type: string
        default: npm exec --no -- wrangler deploy
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: cloudflare-${{ github.repository }}-${{ inputs.site-id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false
      - name: Validate toolchain selection
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: 'case "$TOOLCHAIN" in node|mise) ;; *) exit 1 ;; esac'
      - uses: actions/setup-node@v7
        if: inputs.toolchain == 'node'
        with:
          node-version: ${{ inputs.node-version }}
      - uses: jdx/mise-action@v4.3.0
        if: inputs.toolchain == 'mise'
        with:
          cache: true
      - name: Install deployment dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -e -o pipefail -c "$COMMAND"
      - uses: $/actions/docs-cloudflare
        with:
          expected-sha: ${{ inputs.expected-sha }}
          artifact-name: ${{ inputs.artifact-name }}
          site-directory: ${{ inputs.site-directory }}
          working-directory: ${{ inputs.working-directory }}
          deploy-command: ${{ inputs.deploy-command }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
