name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check bundled runtime dependencies
        run: pnpm build:check
      - name: Install locked npm consumer tools
        run: |
          for project in examples/npm-package examples/subpackage/packages/widget; do
            npm ci --prefix "$project" --ignore-scripts --no-audit --no-fund
            "$project/node_modules/.bin/release-it" --version
          done
      - run: pnpm test
      - name: Lint workflows, action metadata and consumer examples
        run: pnpm lint
