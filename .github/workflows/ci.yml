name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Lint workflows, action metadata and consumer examples
        run: pnpm lint
