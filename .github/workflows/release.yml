name: Publish a checked candidate and its documentation
on:
  workflow_call:
    inputs:
      release-tag:
        description: Existing tag; run the workflow at this same tag.
        type: string
        required: true
      verify-command:
        type: string
        required: true
      package-manager:
        description: Native packer, npm or pnpm; the selected tool must be installed by setup.
        type: string
        default: npm
      package-verify-command:
        description: Additional checks of the already packed file via TARBALL.
        type: string
        default: ""
      expected-sha:
        type: string
        default: ""
      tag-prefix:
        type: string
        default: v
      working-directory:
        type: string
        default: .
      toolchain:
        description: node uses setup-node; mise uses the consumer configuration.
        type: string
        default: node
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: npm ci
      npm-tag:
        type: string
        default: auto
      environment-name:
        type: string
        default: npm-publish
      docs-provider:
        type: string
        default: none
      docs-check-command:
        type: string
        default: ""
      docs-build-command:
        type: string
        default: npm run docs:build
      docs-site-directory:
        type: string
        default: ""
      docs-working-directory:
        type: string
        default: .
      docs-install-command:
        type: string
        default: ""
      docs-environment-name:
        type: string
        default: ""
      docs-concurrency-group:
        type: string
        default: ""
      docs-site-id:
        type: string
        default: documentation
      docs-deploy-command:
        type: string
        default: npm exec --no -- wrangler deploy
      deployment-policy:
        type: string
        default: latest-stable
      artifact-name:
        type: string
        default: documentation
      retention-days:
        type: number
        default: 7
      deploy-docs:
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      source-sha:
        value: ${{ jobs.publish.outputs.source-sha }}
        description: Verified and published source commit.
      version:
        value: ${{ jobs.publish.outputs.version }}
        description: Published npm registry version.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: source
        uses: $/actions/release-source
        with:
          mode: release
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
          docs-provider: ${{ inputs.docs-provider }}
          deployment-policy: ${{ inputs.deployment-policy }}
  documentation:
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      source-ref: ${{ needs.source.outputs.source-sha }}
      check-command: ${{ inputs.docs-check-command }}
      build-command: ${{ inputs.docs-build-command }}
      site-directory: ${{ inputs.docs-site-directory }}
      working-directory: ${{ inputs.docs-working-directory }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.docs-install-command || inputs.install-command }}
    needs: source
    if: inputs.docs-provider != 'none'
  publish:
    needs:
      - source
      - documentation
    if: ${{ !cancelled() && needs.source.result == 'success' && ((inputs.docs-provider == 'none' && needs.documentation.result == 'skipped') || (inputs.docs-provider != 'none' && needs.documentation.result == 'success')) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      release-tag: ${{ inputs.release-tag }}
      verify-command: ${{ inputs.verify-command }}
      package-manager: ${{ inputs.package-manager }}
      package-verify-command: ${{ inputs.package-verify-command }}
      expected-sha: ${{ needs.source.outputs.source-sha }}
      tag-prefix: ${{ inputs.tag-prefix }}
      working-directory: ${{ inputs.working-directory }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      npm-tag: ${{ inputs.npm-tag }}
      environment-name: ${{ inputs.environment-name }}
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      provider: ${{ inputs.docs-provider }}
      expected-sha: ${{ needs.source.outputs.source-sha }}
      release-tag: ${{ inputs.release-tag }}
      deployment-policy: ${{ inputs.deployment-policy }}
      artifact-name: ${{ inputs.artifact-name }}
      environment-name: ${{ inputs.docs-environment-name }}
      concurrency-group: ${{ inputs.docs-concurrency-group }}
      site-id: ${{ inputs.docs-site-id }}
      site-directory: ${{ inputs.docs-site-directory }}
      working-directory: ${{ inputs.docs-working-directory }}
      toolchain: ${{ inputs.toolchain }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.docs-install-command || inputs.install-command }}
      deploy-command: ${{ inputs.docs-deploy-command }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    needs:
      - source
      - documentation
      - publish
    if: inputs.docs-provider != 'none' && inputs.deploy-docs
