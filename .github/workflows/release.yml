name: Publish a checked candidate and its documentation
on:
  workflow_call:
    inputs:
      config-file:
        description: Tracked project JSON configuration at the selected source.
        type: string
        default: .github/xova.json
      release-tag:
        description: Existing tag; run the workflow at this same tag.
        type: string
        required: true
      expected-sha:
        type: string
        default: ""
      artifact-name:
        type: string
        default: documentation
      retention-days:
        type: number
        default: 7
      deploy-docs:
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      source-sha:
        value: ${{ jobs.publish.outputs.source-sha }}
        description: Verified and published source commit.
      version:
        value: ${{ jobs.publish.outputs.version }}
        description: Published npm registry version.
      tarball-sha256:
        value: ${{ jobs.publish.outputs.tarball-sha256 }}
        description: SHA-256 of the exact verified and published tarball.
      publication-artifact:
        value: ${{ jobs.publish.outputs.publication-artifact }}
        description: Same-run npm publication result artifact, retained independently of docs deployment.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.config.outputs.config }}
      docs-provider: ${{ fromJSON(steps.config.outputs.config).docs.provider }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: config
        uses: $/actions/project-config
        with:
          config-file: ${{ inputs.config-file }}
          expected-sha: ${{ inputs.expected-sha || github.sha }}
          task: release
      - id: source
        uses: $/actions/release-source
        with:
          mode: release
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.expected-sha }}
          docs-provider: ${{ fromJSON(steps.config.outputs.config).docs.provider }}
          deployment-policy: ${{ fromJSON(steps.config.outputs.config).docs.deployment-policy }}
  documentation:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
    with:
      kind: docs
      config-file: ${{ inputs.config-file }}
      source-sha: ${{ needs.source.outputs.source-sha }}
      artifact-name: ${{ inputs.artifact-name }}
      retention-days: ${{ inputs.retention-days }}
    needs: source
    if: needs.source.outputs.docs-provider != 'none'
  publish:
    needs:
      - source
      - documentation
    if: ${{ !cancelled() && needs.source.result == 'success' && ((needs.source.outputs.docs-provider == 'none' && needs.documentation.result == 'skipped') || (needs.source.outputs.docs-provider != 'none' && needs.documentation.result == 'success')) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ fromJSON(needs.source.outputs.config).npm.environment-name }}
    concurrency:
      group: ${{ format('npm-{0}-{1}-{2}', github.repository, fromJSON(needs.source.outputs.config).setup.working-directory, inputs.release-tag) }}
      cancel-in-progress: false
    outputs:
      source-sha: ${{ steps.publish.outputs.source-sha }}
      version: ${{ steps.publish.outputs.version }}
      tarball-sha256: ${{ steps.publish.outputs.tarball-sha256 }}
      publication-artifact: ${{ steps.publish.outputs.publication-artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: $/actions/setup
        with:
          toolchain: ${{ fromJSON(needs.source.outputs.config).setup.toolchain }}
          node-version: ${{ fromJSON(needs.source.outputs.config).setup.node-version }}
          install-command: ${{ fromJSON(needs.source.outputs.config).setup.install-command }}
          working-directory: ${{ fromJSON(needs.source.outputs.config).setup.working-directory }}
      - id: publish
        uses: $/actions/npm-publish
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ needs.source.outputs.source-sha }}
          tag-prefix: ${{ fromJSON(needs.source.outputs.config).npm.tag-prefix }}
          working-directory: ${{ fromJSON(needs.source.outputs.config).setup.working-directory }}
          verify-command: ${{ fromJSON(needs.source.outputs.config).npm.verify-command }}
          package-manager: ${{ fromJSON(needs.source.outputs.config).npm.package-manager }}
          package-verify-command: ${{ fromJSON(needs.source.outputs.config).npm.package-verify-command }}
          npm-tag: ${{ fromJSON(needs.source.outputs.config).npm.npm-tag }}
  deploy:
    uses: ./.github/workflows/docs-deploy.yml
    with:
      config-file: ${{ inputs.config-file }}
      expected-sha: ${{ needs.source.outputs.source-sha }}
      release-tag: ${{ inputs.release-tag }}
      artifact-name: ${{ inputs.artifact-name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    needs:
      - source
      - documentation
      - publish
    if: needs.source.outputs.docs-provider != 'none' && inputs.deploy-docs
