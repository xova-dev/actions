name: Two Cloudflare documentation targets
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        site:
          - handbook
          - api
    uses: xova-dev/actions/.github/workflows/check.yml@v1
    with:
      config-file: ${{ format('.github/xova-{0}.json', matrix.site) }}
      source-sha: ${{ github.sha }}
      artifact-name: ${{ format('docs-{0}', matrix.site) }}
      kind: docs
  deploy:
    needs: build
    strategy:
      matrix:
        site:
          - handbook
          - api
    uses: xova-dev/actions/.github/workflows/docs-deploy.yml@v1
    with:
      config-file: ${{ format('.github/xova-{0}.json', matrix.site) }}
      expected-sha: ${{ github.sha }}
      artifact-name: ${{ format('docs-{0}', matrix.site) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
