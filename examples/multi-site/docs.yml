name: Two Cloudflare documentation targets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        site: [handbook, api]
    uses: xova-dev/actions/.github/workflows/docs-build.yml@v1
    with:
      source-ref: ${{ github.sha }}
      check-command: npm run docs:check --workspace=${{ matrix.site }}
      build-command: npm run docs:build --workspace=${{ matrix.site }}
      site-directory: sites/${{ matrix.site }}/dist
      artifact-name: docs-${{ matrix.site }}
  deploy:
    needs: build
    strategy:
      matrix:
        site: [handbook, api]
    uses: xova-dev/actions/.github/workflows/docs-cloudflare.yml@v1
    with:
      expected-sha: ${{ github.sha }}
      artifact-name: docs-${{ matrix.site }}
      site-id: ${{ matrix.site }}
      environment-name: docs-${{ matrix.site }}
      site-directory: sites/${{ matrix.site }}/dist
      deploy-command: npm exec --no -- wrangler deploy --config sites/${{ matrix.site }}/wrangler.jsonc
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
