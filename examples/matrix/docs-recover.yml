name: Recover documentation
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Confirmed stable release; select this same tag as the workflow ref
        required: true
        type: string
      published-sha:
        description: Exact commit of the confirmed npm publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    uses: xova-dev/actions/.github/workflows/docs-recover.yml@v1
    permissions:
      contents: read
      id-token: write
      pages: write
    with:
      release-tag: ${{ inputs.release-tag }}
      published-sha: ${{ inputs.published-sha }}
      docs-provider: pages
      docs-check-command: pnpm docs:typecheck
      docs-build-command: pnpm docs:build
      docs-site-directory: docs/.vitepress/dist
      docs-environment-name: github-pages
      docs-concurrency-group: github-pages
      deployment-policy: latest-stable
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
