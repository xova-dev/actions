name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag; run this workflow at the same tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source-sha: ${{ github.sha }}
  release:
    needs: checks
    uses: xova-dev/actions/.github/workflows/release.yml@v1
    permissions:
      contents: read
      id-token: write
      pages: write
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      expected-sha: ${{ needs.checks.outputs.source-sha }}
      package-manager: pnpm
      verify-command: pnpm release:check
      package-verify-command: pnpm test:pack --profile daily
      docs-provider: pages
      docs-check-command: pnpm docs:typecheck
      docs-build-command: pnpm docs:build
      docs-site-directory: docs/.vitepress/dist
      docs-environment-name: github-pages
      docs-concurrency-group: github-pages
      deployment-policy: latest-stable
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
      environment-name: npm-publish
      deploy-docs: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
