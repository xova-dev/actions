name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag; run this workflow at the same tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  documentation:
    uses: xova-dev/actions/.github/workflows/docs-build.yml@v1
    with:
      source-ref: ${{ github.event.release.tag_name || inputs.release-tag }}
      check-command: pnpm docs:typecheck
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm docs:build
      site-directory: docs/.vitepress/dist
  publish:
    needs:
      - documentation
      - compatibility
      - electron
    uses: xova-dev/actions/.github/workflows/npm-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      expected-sha: ${{ needs.documentation.outputs.source-sha }}
      verify-command: pnpm lint && pnpm typecheck && pnpm build && pnpm check:examples && pnpm --filter
        matrix-basic-example run doctor && pnpm --filter matrix-basic-example run test && pnpm
        --filter matrix-basic-example run build
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
  compatibility:
    needs: documentation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22.18.0
          - 24.x
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.documentation.outputs.source-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:pack --profile ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24.x' && 'full' ||
          (runner.os == 'Linux' && 'daily' || 'platform') }}
  electron:
    needs: documentation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.documentation.outputs.source-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:electron-web
      - if: runner.os != 'Linux'
        run: pnpm test:electron-web
  deploy:
    needs:
      - publish
      - documentation
    runs-on: ubuntu-latest
    environment: github-pages
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: policy
        uses: xova-dev/actions/actions/latest-release@v1
        with:
          release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
          expected-sha: ${{ needs.publish.outputs.source-sha }}
      - uses: xova-dev/actions/actions/docs-pages@v1
        if: steps.policy.outputs.eligible == 'true'
        with:
          expected-sha: ${{ needs.publish.outputs.source-sha }}
