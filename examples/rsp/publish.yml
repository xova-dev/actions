name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag; run this workflow at the same tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  documentation:
    uses: xova-dev/actions/.github/workflows/docs-build.yml@v1
    with:
      source-ref: ${{ github.event.release.tag_name || inputs.release-tag }}
      check-command: pnpm docs:check
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm docs:build
      site-directory: docs/.vitepress/dist
  publish:
    needs: documentation
    uses: xova-dev/actions/.github/workflows/npm-publish.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      expected-sha: ${{ needs.documentation.outputs.source-sha }}
      verify-command: RSP_INSTALL_ALLOW_NETWORK=1 pnpm release:check
      install-command: pnpm install --frozen-lockfile && uv sync --project tests/skills --frozen
      toolchain: mise
  deploy:
    needs:
      - publish
      - documentation
    runs-on: ubuntu-latest
    environment: docs-production
    concurrency:
      group: cloudflare-${{ github.repository }}-documentation
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: policy
        uses: xova-dev/actions/actions/latest-release@v1
        with:
          release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
          expected-sha: ${{ needs.publish.outputs.source-sha }}
      - uses: actions/checkout@v7
        if: steps.policy.outputs.eligible == 'true'
        with:
          ref: ${{ needs.publish.outputs.source-sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        if: steps.policy.outputs.eligible == 'true'
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
        if: steps.policy.outputs.eligible == 'true'
      - uses: xova-dev/actions/actions/docs-cloudflare@v1
        if: steps.policy.outputs.eligible == 'true'
        with:
          expected-sha: ${{ needs.publish.outputs.source-sha }}
          site-directory: docs/.vitepress/dist
          deploy-command: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
