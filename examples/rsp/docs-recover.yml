name: Recover documentation
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable release whose npm publication has been confirmed
        required: true
        type: string
      published-sha:
        description: Exact commit of the confirmed npm publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    uses: xova-dev/actions/.github/workflows/docs-recover.yml@v1
    permissions:
      contents: read
    with:
      release-tag: ${{ inputs.release-tag }}
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
      docs-provider: cloudflare
      docs-check-command: pnpm docs:check
      docs-build-command: pnpm docs:build
      docs-site-directory: docs/.vitepress/dist
      docs-deploy-command: pnpm exec wrangler deploy
      docs-environment-name: docs-production
      published-sha: ${{ inputs.published-sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
