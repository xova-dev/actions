name: Recover documentation
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable release whose npm publication has been confirmed
        required: true
        type: string
      published-sha:
        description: Exact commit of the confirmed npm publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    uses: xova-dev/actions/.github/workflows/docs-recover.yml@v1
    permissions:
      contents: read
    with:
      release-tag: ${{ inputs.release-tag }}
      published-sha: ${{ inputs.published-sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
