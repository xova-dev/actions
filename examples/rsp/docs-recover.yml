name: Recover documentation
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable release whose npm publication has been confirmed
        required: true
        type: string
      published-sha:
        description: Exact commit of the confirmed npm publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  documentation:
    uses: xova-dev/actions/.github/workflows/docs-build.yml@v1
    with:
      source-ref: ${{ inputs.published-sha }}
      check-command: pnpm docs:check
      toolchain: mise
      install-command: pnpm install --frozen-lockfile
      build-command: pnpm docs:build
      site-directory: docs/.vitepress/dist
  deploy:
    needs:
      - documentation
    runs-on: ubuntu-latest
    environment: docs-production
    concurrency:
      group: cloudflare-${{ github.repository }}-documentation
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: policy
        uses: xova-dev/actions/actions/latest-release@v1
        with:
          release-tag: ${{ inputs.release-tag }}
          expected-sha: ${{ inputs.published-sha }}
      - uses: actions/checkout@v7
        if: steps.policy.outputs.eligible == 'true'
        with:
          ref: ${{ inputs.published-sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
        if: steps.policy.outputs.eligible == 'true'
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
        if: steps.policy.outputs.eligible == 'true'
      - uses: xova-dev/actions/actions/docs-cloudflare@v1
        if: steps.policy.outputs.eligible == 'true'
        with:
          expected-sha: ${{ inputs.published-sha }}
          site-directory: docs/.vitepress/dist
          deploy-command: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
