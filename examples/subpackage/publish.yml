name: Publish one independently tagged subpackage
on:
  push:
    tags: ['widget@*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: widget-npm
    concurrency:
      group: widget-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: packages/widget
      - uses: xova-dev/actions/actions/npm-publish@v1
        with:
          release-tag: ${{ github.ref_name }}
          tag-prefix: widget@
          working-directory: packages/widget
          verify-command: npm test && npm run build
