name: Build and deploy documentation without a package release
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    uses: xova-dev/actions/.github/workflows/check.yml@v1
    with:
      kind: docs
      source-sha: ${{ github.sha }}
  deploy:
    needs: build
    uses: xova-dev/actions/.github/workflows/docs-deploy.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      expected-sha: ${{ needs.build.outputs.source-sha }}
