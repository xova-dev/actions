name: Set up a project
description: Select the toolchain and install locked project dependencies.
inputs:
  toolchain:
    description: node or mise.
    default: node
  node-version:
    description: Node version for the node toolchain.
    default: '24'
  install-command:
    description: Locked dependency installation command.
    default: npm ci
  working-directory:
    description: Project directory in the checkout.
    default: '.'
runs:
  using: composite
  steps:
    - name: Validate toolchain selection
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: 'case "$TOOLCHAIN" in node|mise) ;; *) exit 1 ;; esac'
    - uses: actions/setup-node@v7
      if: inputs.toolchain == 'node'
      with:
        node-version: ${{ inputs.node-version }}
    - uses: jdx/mise-action@v4.3.0
      if: inputs.toolchain == 'mise'
      with:
        cache: true
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.install-command }}
      run: bash -e -o pipefail -c "$COMMAND"
